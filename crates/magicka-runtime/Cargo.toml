[package]
name = "magicka-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Every tests/*.rs file is a module of one executable (tests/all.rs, generated
# by tools/gen_test_aggregate.py) so the Bevy/physics graph links once; see
# research/build-config.md. Run a former suite with `--test all <module>::`.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
magicka-content = { path = "../magicka-content" }
magicka-sim = { path = "../magicka-sim" }
quick-xml = "0.41.0"
magicka-xnb = { path = "../magicka-xnb" }
magicka-physics = { path = "../magicka-physics" }
magicka-network = { path = "../magicka-network" }
magicka-mods = { path = "../magicka-mods" }
magicka-definitions = { path = "../magicka-definitions" }
magicka-script = { path = "../magicka-script" }

serde_json = "1.0.151"
