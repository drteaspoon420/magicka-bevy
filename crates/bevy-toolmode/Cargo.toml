[package]
name = "bevy-toolmode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable editor / dungeon-master tool mode for Bevy: tool and spawn menu, hotbar, freecam, cursor reticle, transform gizmos, staged spawns and generated thumbnails"

[dependencies]
bevy = "0.19.1"
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }
