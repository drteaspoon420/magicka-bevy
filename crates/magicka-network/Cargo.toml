[package]
name = "magicka-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magicka-sim = { path = "../magicka-sim" }
magicka-physics = { path = "../magicka-physics" }
bevy = { version = "0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded"] }
lightyear = { version = "0.30.1", default-features = false, features = ["std", "client", "server", "udp", "netcode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
