[package]
name = "magicka-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Mod packages: KeyValues syntax, manifests, load order, the layered virtual
# filesystem and content hashes (rewrite extension; no retail format).
[dependencies]
semver = "1.0.28"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
