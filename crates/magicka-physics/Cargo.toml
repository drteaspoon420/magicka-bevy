[package]
name = "magicka-physics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless Avian physics host for local and networked gameplay"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded"] }
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
